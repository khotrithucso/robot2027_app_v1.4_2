name: Build Robot2027 App V1.4 Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Thiết lập Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Thiết lập Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Cài đặt Capacitor Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 5. Khởi tạo dự án Android Capacitor
        run: |
          npx cap add android

      - name: 6. Tích hợp Native Android Plugin (Kiosk LockTask, Wi-Fi IP, Zero-Beep Mic, Dual TTS, BLE)
        run: |
          PKG_DIR="android/app/src/main/java/com/robot2027/companion"
          mkdir -p "$PKG_DIR"

          cat << 'EOF' > "$PKG_DIR/RobotNativePlugin.java"
          package com.robot2027.companion;

          import android.Manifest;
          import android.app.Activity;
          import android.app.ActivityManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageManager;
          import android.media.AudioManager;
          import android.net.wifi.WifiInfo;
          import android.net.wifi.WifiManager;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.text.format.Formatter;
          import android.view.View;
          import android.view.WindowManager;

          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.util.ArrayList;
          import java.util.Locale;

          @CapacitorPlugin(name = "RobotNative")
          public class RobotNativePlugin extends Plugin {

              private TextToSpeech tts;
              private SpeechRecognizer speechRecognizer;
              private boolean isListening = false;
              private int savedNotifVol = -1;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());

              @Override
              public void load() {
                  mainHandler.post(() -> {
                      initTTS();
                      applyKioskFlags(true);
                  });
              }

              private void initTTS() {
                  tts = new TextToSpeech(getContext(), status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          tts.setLanguage(Locale.US);
                          tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                              @Override
                              public void onStart(String utteranceId) {
                                  JSObject data = new JSObject();
                                  data.put("id", utteranceId);
                                  notifyListeners("ttsStart", data);
                              }

                              @Override
                              public void onDone(String utteranceId) {
                                  JSObject data = new JSObject();
                                  data.put("id", utteranceId);
                                  notifyListeners("ttsEnd", data);
                              }

                              @Override
                              public void onError(String utteranceId) {
                                  JSObject data = new JSObject();
                                  data.put("id", utteranceId);
                                  notifyListeners("ttsEnd", data);
                              }
                          });
                      }
                  });
              }

              private void applyKioskFlags(boolean enable) {
                  Activity activity = getActivity();
                  if (activity == null) return;
                  activity.getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  View decorView = activity.getWindow().getDecorView();

                  if (enable) {
                      decorView.setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                      );
                      try {
                          ActivityManager am = (ActivityManager) activity.getSystemService(Context.ACTIVITY_SERVICE);
                          if (am != null && am.getLockTaskModeState() == ActivityManager.LOCK_TASK_MODE_NONE) {
                              activity.startLockTask();
                          }
                      } catch (Exception ignored) {}
                  } else {
                      try {
                          activity.stopLockTask();
                      } catch (Exception ignored) {}
                      decorView.setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                  }
              }

              @PluginMethod
              public void requestAllPermissions(PluginCall call) {
                  Activity activity = getActivity();
                  if (activity == null) {
                      call.resolve();
                      return;
                  }
                  ArrayList<String> perms = new ArrayList<>();
                  perms.add(Manifest.permission.RECORD_AUDIO);
                  perms.add(Manifest.permission.ACCESS_FINE_LOCATION);
                  perms.add(Manifest.permission.ACCESS_COARSE_LOCATION);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      perms.add(Manifest.permission.BLUETOOTH_CONNECT);
                      perms.add(Manifest.permission.BLUETOOTH_SCAN);
                  }
                  ActivityCompat.requestPermissions(activity, perms.toArray(new String[0]), 2027);
                  call.resolve();
              }

              @PluginMethod
              public void getDeviceStatus(PluginCall call) {
                  Context ctx = getContext();
                  IntentFilter ifilter = new IntentFilter(Intent.ACTION_BATTERY_CHANGED);
                  Intent batteryStatus = ctx.registerReceiver(null, ifilter);

                  int level = 100;
                  float temp = 36.5f;
                  boolean isCharging = false;

                  if (batteryStatus != null) {
                      int rawLevel = batteryStatus.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
                      int scale = batteryStatus.getIntExtra(BatteryManager.EXTRA_SCALE, -1);
                      if (rawLevel >= 0 && scale > 0) {
                          level = Math.round((rawLevel * 100f) / scale);
                      }
                      int rawTemp = batteryStatus.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 365);
                      temp = rawTemp / 10.0f;
                      int status = batteryStatus.getIntExtra(BatteryManager.EXTRA_STATUS, -1);
                      isCharging = status == BatteryManager.BATTERY_STATUS_CHARGING ||
                                   status == BatteryManager.BATTERY_STATUS_FULL;
                  }

                  String wifiSsid = "Chưa kết nối Wi-Fi";
                  String localIp = "0.0.0.0";
                  try {
                      WifiManager wifiManager = (WifiManager) ctx.getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                      if (wifiManager != null && wifiManager.isWifiEnabled()) {
                          WifiInfo info = wifiManager.getConnectionInfo();
                          if (info != null) {
                              int ipInt = info.getIpAddress();
                              if (ipInt != 0) {
                                  localIp = Formatter.formatIpAddress(ipInt);
                              }
                              String rawSsid = info.getSSID();
                              if (rawSsid != null) {
                                  wifiSsid = rawSsid.replace("\"", "");
                              }
                              if (wifiSsid.isEmpty() || wifiSsid.contains("unknown ssid")) {
                                  boolean hasLoc = ContextCompat.checkSelfPermission(ctx, Manifest.permission.ACCESS_FINE_LOCATION)
                                      == PackageManager.PERMISSION_GRANTED;
                                  wifiSsid = hasLoc ? "Đã kết nối (Bật GPS để hiện tên)" : "Đã kết nối (Cần cấp quyền Vị trí)";
                              }
                          }
                      }
                  } catch (Exception e) {
                      wifiSsid = "Wi-Fi Sẵn sàng";
                  }

                  boolean isPinned = false;
                  try {
                      ActivityManager am = (ActivityManager) ctx.getSystemService(Context.ACTIVITY_SERVICE);
                      if (am != null) {
                          isPinned = am.getLockTaskModeState() != ActivityManager.LOCK_TASK_MODE_NONE;
                      }
                  } catch (Exception ignored) {}

                  JSObject ret = new JSObject();
                  ret.put("battery", level);
                  ret.put("temperature", temp);
                  ret.put("isCharging", isCharging);
                  ret.put("wifiSsid", wifiSsid);
                  ret.put("localIp", localIp);
                  ret.put("isPinned", isPinned);
                  call.resolve(ret);
              }

              @PluginMethod
              public void setBrightness(PluginCall call) {
                  int level = call.getInt("level", 70);
                  float val = Math.max(0.05f, Math.min(1.0f, level / 100.0f));
                  mainHandler.post(() -> {
                      Activity activity = getActivity();
                      if (activity != null) {
                          WindowManager.LayoutParams lp = activity.getWindow().getAttributes();
                          lp.screenBrightness = val;
                          activity.getWindow().setAttributes(lp);
                      }
                      call.resolve();
                  });
              }

              @PluginMethod
              public void setVolume(PluginCall call) {
                  int level = call.getInt("level", 80);
                  AudioManager am = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                  if (am != null) {
                      int max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                      int target = Math.round((level / 100.0f) * max);
                      am.setStreamVolume(AudioManager.STREAM_MUSIC, target, 0);
                  }
                  call.resolve();
              }

              @PluginMethod
              public void speak(PluginCall call) {
                  String text = call.getString("text", "");
                  String lang = call.getString("lang", "en-US");
                  float rate = call.getFloat("rate", 0.95f);
                  float pitch = call.getFloat("pitch", 1.08f);

                  if (tts == null || text.isEmpty()) {
                      call.resolve();
                      return;
                  }

                  mainHandler.post(() -> {
                      Locale locale = lang.startsWith("vi") ? new Locale("vi", "VN") : Locale.US;
                      tts.setLanguage(locale);
                      tts.setSpeechRate(rate);
                      tts.setPitch(pitch);
                      Bundle params = new Bundle();
                      String uttId = "utt_" + System.currentTimeMillis();
                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, params, uttId);
                      call.resolve();
                  });
              }

              @PluginMethod
              public void stopSpeak(PluginCall call) {
                  if (tts != null) {
                      tts.stop();
                  }
                  call.resolve();
              }

              @PluginMethod
              public void startListening(PluginCall call) {
                  String lang = call.getString("lang", "en-US");
                  mainHandler.post(() -> {
                      try {
                          muteBeep(true);
                          if (speechRecognizer != null) {
                              speechRecognizer.destroy();
                          }
                          speechRecognizer = SpeechRecognizer.createSpeechRecognizer(getContext());
                          speechRecognizer.setRecognitionListener(new RecognitionListener() {
                              @Override public void onReadyForSpeech(Bundle params) {
                                  mainHandler.postDelayed(() -> muteBeep(false), 350);
                              }
                              @Override public void onBeginningOfSpeech() {}
                              @Override public void onRmsChanged(float rmsdB) {}
                              @Override public void onBufferReceived(byte[] buffer) {}
                              @Override public void onEndOfSpeech() { isListening = false; }
                              @Override public void onError(int error) {
                                  isListening = false;
                                  muteBeep(false);
                                  JSObject err = new JSObject();
                                  err.put("code", error);
                                  notifyListeners("speechError", err);
                              }
                              @Override public void onResults(Bundle results) {
                                  isListening = false;
                                  ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                                  String best = (matches != null && !matches.isEmpty()) ? matches.get(0) : "";
                                  JSObject res = new JSObject();
                                  res.put("text", best);
                                  notifyListeners("speechResult", res);
                              }
                              @Override public void onPartialResults(Bundle partialResults) {
                                  ArrayList<String> matches = partialResults.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                                  if (matches != null && !matches.isEmpty()) {
                                      JSObject res = new JSObject();
                                      res.put("text", matches.get(0));
                                      notifyListeners("speechPartial", res);
                                  }
                              }
                              @Override public void onEvent(int eventType, Bundle params) {}
                          });

                          Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                          intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                          intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang);
                          intent.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                          isListening = true;
                          speechRecognizer.startListening(intent);
                          call.resolve();
                      } catch (Exception e) {
                          muteBeep(false);
                          call.reject("Mic error: " + e.getMessage());
                      }
                  });
              }

              @PluginMethod
              public void stopListening(PluginCall call) {
                  mainHandler.post(() -> {
                      isListening = false;
                      if (speechRecognizer != null) {
                          speechRecognizer.stopListening();
                      }
                      muteBeep(false);
                      call.resolve();
                  });
              }

              private void muteBeep(boolean mute) {
                  try {
                      AudioManager am = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                      if (am == null) return;
                      if (mute) {
                          if (savedNotifVol < 0) {
                              savedNotifVol = am.getStreamVolume(AudioManager.STREAM_NOTIFICATION);
                          }
                          am.setStreamVolume(AudioManager.STREAM_NOTIFICATION, 0, 0);
                      } else if (savedNotifVol >= 0) {
                          am.setStreamVolume(AudioManager.STREAM_NOTIFICATION, savedNotifVol, 0);
                          savedNotifVol = -1;
                      }
                  } catch (Exception ignored) {}
              }

              @PluginMethod
              public void openWifiSettings(PluginCall call) {
                  mainHandler.post(() -> {
                      Intent intent = Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q
                          ? new Intent(Settings.Panel.ACTION_WIFI)
                          : new Intent(Settings.ACTION_WIFI_SETTINGS);
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(intent);
                      call.resolve();
                  });
              }

              @PluginMethod
              public void setKioskMode(PluginCall call) {
                  boolean enabled = call.getBoolean("enabled", true);
                  mainHandler.post(() -> {
                      applyKioskFlags(enabled);
                      call.resolve();
                  });
              }
          }
          EOF

          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.robot2027.companion;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(RobotNativePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

          python3 -c '
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          txt = p.read_text(encoding="utf-8")
          perms = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <queries>
                  <intent><action android:name="android.speech.RecognitionService" /></intent>
                  <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>
              </queries>
          """
          if "ACCESS_FINE_LOCATION" not in txt:
              txt = txt.replace("<application", perms + "\n    <application", 1)
          if "usesCleartextTraffic" not in txt:
              txt = txt.replace("<application", "<application android:usesCleartextTraffic=\"true\"", 1)
          if "screenOrientation" not in txt:
              txt = txt.replace("android:name=\".MainActivity\"", "android:name=\".MainActivity\" android:screenOrientation=\"sensorLandscape\"", 1)
          p.write_text(txt, encoding="utf-8")
          '

      - name: 7. Đồng bộ Web & Biên dịch APK Debug V1.4 Pro
        run: |
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/g' android/variables.gradle
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/g' android/variables.gradle
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Xuất file APK V1.4 Pro hoàn chỉnh
        uses: actions/upload-artifact@v4
        with:
          name: Robot2027-App-V1.4-Pro-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
