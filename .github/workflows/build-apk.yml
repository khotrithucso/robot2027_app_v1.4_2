name: Build Robot2027 App V1.4 Full APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Thiết lập Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Thiết lập Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Cài đặt Capacitor Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 5. Khởi tạo dự án Android Capacitor
        run: |
          npx cap add android

      - name: 6. Tích hợp Native Android Plugin (Kiosk, Wi-Fi IP, Zero-Beep Mic, Dual TTS, BLE ESP32)
        run: |
          PKG_DIR="android/app/src/main/java/com/robot2027/companion"
          mkdir -p "$PKG_DIR"
          cp native_android/java/com/robot2027/companion/*.java "$PKG_DIR/"
          python3 native_android/patch_android.py

      - name: 7. Đồng bộ Web & Biên dịch APK Debug V1.4 Full
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Xuất file APK V1.4 hoàn chỉnh
        uses: actions/upload-artifact@v4
        with:
          name: Robot2027-App-V1.4-Full-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
